    origin_eu: true
    reliability: bassa
    base: https://frame.work
    search_url: https://frame.work/it/en/desktop
    note: "Cloudflare + app Rails: nessuna API JSON pubblica."

  - name: template_shopify
    adapter: shopify
    enabled: false
